[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcapman-engine"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["scapy==2.6.1"]

[tool.setuptools]
packages = ["engine", "engine.services"]
package-dir = { engine = ".", "engine.services" = "services" }